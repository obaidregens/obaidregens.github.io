baseurl: ""
url: "https://obaidregens.github.io"

# Build settings
remote_theme: jekyll/minima

minima:
  hide_site_feed_link: true

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
